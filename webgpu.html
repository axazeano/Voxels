<body>

<canvas id="c"></canvas>

<script type="module">
'use strict';
// ============================================================
//  Решатель XPBD на WebGPU compute.
//  Балки раскрашены в 26 цветов (13 направлений × чётность), каждый цвет —
//  отдельный dispatch, внутри цвета ни одна пара балок не делит узел,
//  поэтому получается настоящий Гаусс–Зейдель без гонок.
//  Столкновения — spatial hash на GPU (счётчики через atomics, K слотов на ячейку).
//  Рендер «гладкой» поверхности: узлы — вершины гексаэдральной решётки, угол ячейки
//  2×2×2 — среднее по узлам ячейки, связанным живыми осевыми балками (K_SKIN).
// ============================================================
const MAX_BALLS = 16, MAX_OBJ = 128, MAX_ITER = 16, K_SLOTS = 8, HASH_BITS = 18, HASH_SIZE = 1 << HASH_BITS, WG = 128;
const STRESS_SCALE = 16384, BALL_FIX = 65536;
// Физический масштаб: 1 базовый воксель = 20 см, поэтому машина длиной 22 вокселя
// имеет привычные 4.4 м. Масса узла = rho * (размер вокселя)^3, то есть не зависит
// от детализации: мельче сетка — легче узлы, суммарная масса тела та же.
// Единица массы симуляции = 1 ед^3 материала плотностью 1 т/м^3 = 8 кг.
const M_PER_UNIT = 0.2, KG_PER_SIM = 1000 * M_PER_UNIT ** 3;
// yieldS — предел текучести, делённый на модуль (безразмерная деформация начала
// пластики), поэтому от детализации не зависит. У конструкционных материалов (сталь,
// дерево) он поднят выше физического: модуль E здесь на пять порядков меньше
// настоящего, и при честных 0.002 предел sigma = E*yieldS даёт длину самонесущего
// пролёта всего 3.5 м — рамная конструкция складывается под собственным весом.
// У кузовного металла значение оставлено физическим, поэтому машина по-прежнему мнётся. rho — настоящая плотность, т/м^3. E — модуль упругости в единицах симуляции:
// податливость балки comp = 1/(E * размер вокселя), поэтому жёсткость масштабируется
// с сеткой правильно, а скорость звука sqrt(E/rho) от детализации не зависит.
// brk — предельная деформация на РАСТЯЖЕНИЕ; сжатие держится в BRK_COMP раз лучше.
// voro — множитель порога разрыва для балок через границу ячеек Вороного (1 = не применяется)
const MATS = {
  metal:  { color:[0.82,0.18,0.16], E:2.7e5, yieldS:0.002, plastic:0.25, brk:0.55, rho:2.70, voro:1 },
  steel:  { color:[0.60,0.64,0.70], E:8.2e5, yieldS:0.015, plastic:0.15, brk:0.70, rho:7.85, voro:1 },
  glass:  { color:[0.70,0.88,1.00], E:6.9e5, yieldS:9,     plastic:0,    brk:0.002, rho:2.50, voro:0.2 },
  brick:  { color:[0.80,0.38,0.22], E:2.3e5, yieldS:9,     plastic:0,    brk:0.0024,rho:1.80, voro:1 },   // швы задаёт раствор
  mortar: { color:[0.72,0.66,0.58], E:1.6e5, yieldS:9,     plastic:0,    brk:0.0016,rho:1.90, voro:1 },
  rubber: { color:[0.13,0.13,0.15], E:3.4e4, yieldS:9,     plastic:0,    brk:1.5,  rho:1.10, voro:1 },
  jelly:  { color:[0.35,0.90,0.55], E:2.1e3, yieldS:9,     plastic:0,    brk:2.5,  rho:1.05, voro:1 },
  wood:   { color:[0.60,0.42,0.22], E:5.4e4, yieldS:0.02,  plastic:0.05, brk:0.09, rho:0.60, voro:0.6 },
  concrete:{color:[0.52,0.53,0.55], E:3.3e5, yieldS:9,     plastic:0,    brk:0.002, rho:2.40, voro:0.25 },
  anchor: { color:[0.30,0.32,0.36], E:4.9e5, yieldS:9,     plastic:0,    brk:9,    rho:7.85, voro:1 },
};
// заметно различающаяся палитра для режима «Материалы»
const MAT_VIEW = { metal:[0.95,0.25,0.25], steel:[0.75,0.78,0.85], glass:[0.35,0.75,1.0], brick:[1.0,0.55,0.2], mortar:[0.95,0.9,0.6], rubber:[0.25,0.25,0.3], jelly:[0.3,0.95,0.4], wood:[0.8,0.55,0.25], concrete:[0.6,0.6,0.65], anchor:[0.9,0.3,0.9] };
const MAT_NAMES_RU = { metal:'металл (пластичный)', steel:'сталь', glass:'стекло (хрупкое)', brick:'кирпич (хрупкий)', mortar:'раствор (хрупкий)', rubber:'резина', jelly:'желе', wood:'дерево', concrete:'бетон (хрупкий)', anchor:'опора (статична)' };
const MAT_LIST = Object.values(MATS), MAT_KEYS = Object.keys(MATS);
const CAR_KG = 1300, CAR_CRUSH = 1.3, CAR_SOFT = 25; // масса машины, путь сминания (м) и податливость полого кузова
const OFFS = [];
for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++)
  if (dx>0 || (dx===0 && dy>0) || (dx===0 && dy===0 && dz>0)) OFFS.push([dx,dy,dz]);
const NCOLORS = OFFS.length * 2;

// ------------------------------------------------------------ WGSL
const COMMON = /* wgsl */`
const K_SLOTS: u32 = ${K_SLOTS}u;
const STRESS_SCALE: f32 = ${STRESS_SCALE}.0;
// Хрупкие материалы держат сжатие во столько раз лучше, чем растяжение. Без этого
// кладку нельзя одновременно сделать слабой на изгиб и способной стоять под своим
// весом: собственный вес грузит её сжатием, а удар — растяжением на изгибе.
const BRK_COMP: f32 = 8.0;
const BALL_FIX: f32 = ${BALL_FIX}.0;
struct Params {
  dt: f32, dt2: f32, gravity: f32, damping: f32,
  friction: f32, compScale: f32, brkScale: f32, plastScale: f32,
  nNodes: u32, nBeams: u32, hashMask: u32, ballCount: u32,
  cellInv: f32, voxel: f32, viewMode: u32, actMode: u32,
  actObj: u32, skinMode: u32, pad1: u32, pad2: u32,
  actCenter: vec4f, actVel: vec4f,
};
// pos.w = обратная масса, vel.w = радиус, info = (alive, big, mat, obj | ballIdx)
struct Node { pos: vec4f, prev: vec4f, vel: vec4f, info: vec4u };
struct NodeNb { id: array<vec4u,2>, beam: array<vec4u,2> };
struct Beam { i: u32, j: u32, rest: f32, rest0: f32, comp: f32, yieldS: f32, plastic: f32, brk: f32 };
fn hashCell(c: vec3i, mask: u32) -> u32 {
  return ((bitcast<u32>(c.x) * 73856093u) ^ (bitcast<u32>(c.y) * 19349663u) ^ (bitcast<u32>(c.z) * 83492791u)) & mask;
}
`;
const K_INTEGRATE = COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> P: Params;
@group(0) @binding(1) var<storage, read_write> nodes: array<Node>;
@group(0) @binding(2) var<storage, read_write> posK: array<vec4f>;
@group(0) @binding(3) var<storage, read_write> posKm1: array<vec4f>;
@compute @workgroup_size(${WG}) fn main(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x; if (i >= P.nNodes) { return; }
  let n = nodes[i]; if (n.info.x == 0u) { return; }
  var v = n.vel.xyz; if (n.pos.w > 0.0) { v.y -= P.gravity * P.dt; } else { v = vec3f(0.0); }
  let p = n.pos.xyz + v * P.dt;
  nodes[i].prev = vec4f(n.pos.xyz, 0.0);
  nodes[i].pos = vec4f(p, n.pos.w);
  nodes[i].vel = vec4f(v, n.vel.w);
  posK[i] = vec4f(p, 0.0); posKm1[i] = vec4f(p, 0.0);
}`;
// Снимок x_k в начале итерации (x_{k-1} ← x_k)
const K_SNAP = COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> P: Params;
@group(0) @binding(1) var<storage, read_write> nodes: array<Node>;
@group(0) @binding(2) var<storage, read_write> posK: array<vec4f>;
@group(0) @binding(3) var<storage, read_write> posKm1: array<vec4f>;
@compute @workgroup_size(${WG}) fn main(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x; if (i >= P.nNodes) { return; }
  posKm1[i] = posK[i]; posK[i] = vec4f(nodes[i].pos.xyz, 0.0);
}`;
// Ускорение Чебышёва (Wang 2015): x_{k+1} = ω(γ(x̂ − x_k) + x_k − x_{k−1}) + x_{k−1}
// Применяется только к решению связей; контакты считаются после экстраполяции.
const K_CHEB = COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> P: Params;
@group(0) @binding(1) var<storage, read_write> nodes: array<Node>;
@group(0) @binding(2) var<storage, read_write> posK: array<vec4f>;
@group(0) @binding(3) var<storage, read_write> posKm1: array<vec4f>;
@group(0) @binding(4) var<uniform> cheb: vec4f; // omega, gamma
@compute @workgroup_size(${WG}) fn main(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x; if (i >= P.nNodes) { return; }
  let n = nodes[i]; if (n.info.x == 0u || n.pos.w == 0.0) { return; }
  let xh = n.pos.xyz; let xk = posK[i].xyz; let xm = posKm1[i].xyz;
  let xn = cheb.x * (cheb.y * (xh - xk) + xk - xm) + xm;
  nodes[i].pos = vec4f(xn, n.pos.w);
}`;
const K_BEAMS = COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> P: Params;
@group(0) @binding(1) var<storage, read_write> nodes: array<Node>;
@group(0) @binding(2) var<storage, read_write> beams: array<Beam>;
@group(0) @binding(3) var<storage, read_write> beamAlive: array<u32>;
@group(0) @binding(4) var<storage, read_write> stat: array<atomic<u32>>; // [2i] напряжение, [2i+1] пластичность
@group(0) @binding(5) var<storage, read_write> counters: array<atomic<u32>>;
@group(0) @binding(6) var<uniform> range: vec4u; // start, count, lastIteration, firstIteration
@group(0) @binding(7) var<storage, read_write> lambda: array<f32>;
@compute @workgroup_size(${WG}) fn main(@builtin(global_invocation_id) g: vec3u) {
  let k = g.x; if (k >= range.y) { return; }
  let b = range.x + k;
  if (beamAlive[b] == 0u) { return; }
  let bm = beams[b]; let i = bm.i; let j = bm.j;
  let pi = nodes[i].pos; let pj = nodes[j].pos;
  if (nodes[i].info.x == 0u || nodes[j].info.x == 0u) { beamAlive[b] = 0u; atomicAdd(&counters[0], 1u); return; }
  let wi = pi.w; let wj = pj.w; let w = wi + wj; if (w == 0.0) { return; }
  let d = pj.xyz - pi.xyz; let len = length(d); if (len < 1e-7) { return; }
  let C = len - bm.rest; let a = bm.comp * P.compScale / P.dt2;
  let lam = select(lambda[b], 0.0, range.w == 1u);
  let dl = (-C - a * lam) / (w + a); lambda[b] = lam + dl;
  let nrm = d / len;
  nodes[i].pos = vec4f(pi.xyz - wi * dl * nrm, wi);
  nodes[j].pos = vec4f(pj.xyz + wj * dl * nrm, wj);
  let rel = (len - bm.rest0) / bm.rest0; let total = abs(rel);
  let brk = bm.brk * P.brkScale * select(1.0, BRK_COMP, rel < 0.0);
  let sn = u32(clamp(total / brk, 0.0, 4.0) * STRESS_SCALE);
  atomicMax(&stat[i * 2u], sn); atomicMax(&stat[j * 2u], sn);
  let pn = u32(clamp(abs(bm.rest - bm.rest0) / bm.rest0, 0.0, 4.0) * STRESS_SCALE);
  atomicMax(&stat[i * 2u + 1u], pn); atomicMax(&stat[j * 2u + 1u], pn);
  if (range.z == 0u) { return; }
  if (total > brk) { beamAlive[b] = 0u; atomicAdd(&counters[0], 1u); return; }
  let pl = bm.plastic * P.plastScale;
  if (pl > 0.0) { let es = abs(len - bm.rest) / bm.rest0; if (es > bm.yieldS) { beams[b].rest = bm.rest + (len - bm.rest) * pl; } }
}`;
const K_HASH = COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> P: Params;
@group(0) @binding(1) var<storage, read_write> nodes: array<Node>;
@group(0) @binding(2) var<storage, read_write> hashCount: array<atomic<u32>>;
@group(0) @binding(3) var<storage, read_write> hashSlots: array<u32>;
@compute @workgroup_size(${WG}) fn main(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x; if (i >= P.nNodes) { return; }
  let n = nodes[i]; if (n.info.x == 0u || n.info.y == 1u) { return; }
  let c = vec3i(floor(n.pos.xyz * P.cellInv));
  let h = hashCell(c, P.hashMask);
  let slot = atomicAdd(&hashCount[h], 1u);
  if (slot < K_SLOTS) { hashSlots[h * K_SLOTS + slot] = i; }
}`;
const K_COLLIDE = COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> P: Params;
@group(0) @binding(1) var<storage, read_write> nodes: array<Node>;
@group(0) @binding(2) var<storage, read_write> nb: array<NodeNb>;
@group(0) @binding(3) var<storage, read_write> beamAlive: array<u32>;
@group(0) @binding(4) var<storage, read_write> hashCount: array<u32>;

ui('scene').addEventListener('change', updateSceneOpts);
updateSceneOpts();
const LEGENDS = { 1: ['0', 'порог разрыва'], 3: ['0 %', '20 % остаточной деформации'], 4: ['0', '3 ед. от формы в покое'], 5: ['0', '30 ед/с'] };
const LEGEND_TEXT = { 6: 'цвет — ячейка Вороного; серый — материал без разбиения' };
function updateLegend() {
  const m = P.viewMode, el = ui('legend');
  if (m === 2) el.innerHTML = MAT_KEYS.map(k => { const c = MAT_VIEW[k]; return `<span class="sw" style="background:rgb(${c.map(v => Math.round(v * 255)).join(',')})"></span>${MAT_NAMES_RU[k]}`; }).join('<br>');
  else if (LEGENDS[m]) el.innerHTML = `<div class="bar"></div><div class="ends"><span>${LEGENDS[m][0]}</span><span>${LEGENDS[m][1]}</span></div>`;
  else if (LEGEND_TEXT[m]) el.textContent = LEGEND_TEXT[m];
  else el.innerHTML = '';
}
ui('view').addEventListener('change', e => { P.viewMode = +e.target.value; updateLegend(); });
ui('skin').addEventListener('change', e => { const v = +e.target.value; const need = (v === 2) !== !!P.ffd; P.skin = v; P.ffd = v === 2 ? 1 : 0; if (need) resetScene(); });
updateLegend();
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); ui('pause').click(); } if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') resetScene();
  if (e.code === 'KeyS') { ui('skin').value = String((P.skin + 1) % 3); ui('skin').dispatchEvent(new Event('change')); }
  const views = { Digit1: 0, Digit2: 2, Digit3: 1, Digit4: 3, Digit5: 4, Digit6: 5, Digit7: 6 }; if (e.code in views) { ui('view').value = String(views[e.code]); ui('view').dispatchEvent(new Event('change')); } });
let dragging = false, moved = 0, lx = 0, ly = 0;
canvas.addEventListener('mousedown', e => { dragging = true; moved = 0; lx = e.clientX; ly = e.clientY; });
window.addEventListener('mousemove', e => { if (!dragging) return; const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  cam.theta += dx * 0.006; cam.phi = Math.min(Math.PI / 2 - 0.05, Math.max(0.15, cam.phi - dy * 0.006)); });
window.addEventListener('mouseup', e => { if (!dragging) return; dragging = false; if (moved < 5 && sim) pickRequest = { x: e.clientX, y: e.clientY, shift: e.shiftKey }; });
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.min(300, Math.max(8, cam.dist * Math.exp(e.deltaY * 0.0015))); }, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// экспорт для отладки
window.dbg = { get sim() { return sim; }, P, cam, get device() { return device; }, resetScene, spawnBall, tick, setPaused: v => { paused = v; }, setLoop: v => { loopEnabled = v; }, setAction: a => { sim.actions.push(a); }, launch,
  bench: async (n) => { const t0 = performance.now(); for (let i = 0; i < n; i++) { tick(); await device.queue.onSubmittedWorkDone(); } return (performance.now() - t0) / n; } };

try { await initGPU(); initPipelines(); await resetScene(); requestAnimationFrame(frame); }
catch (e) { console.error(e); if (!ui('msg').textContent) msg('Ошибка инициализации: ' + e.message); }
</script>
</body>
</html>
