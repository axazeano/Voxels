<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel Soft-Body PoC</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#0e1116; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:#e6e9ef; }
  canvas { display:block; }
  #ui { position:absolute; top:12px; left:12px; width:290px; background:rgba(14,17,22,0.86); border:1px solid #2a3140; border-radius:10px; padding:12px 14px; font-size:13px; backdrop-filter: blur(6px); user-select:none; }
  #ui h1 { font-size:15px; margin:0 0 8px; font-weight:600; }
  #ui .row { display:flex; align-items:center; justify-content:space-between; margin:6px 0; gap:8px; }
  #ui label { flex:1; color:#b8c0cc; }
  #ui input[type=range] { width:130px; }
  #ui select, #ui button { background:#1b2130; color:#e6e9ef; border:1px solid #344056; border-radius:6px; padding:5px 9px; font-size:13px; cursor:pointer; }
  #ui button:hover { background:#25304a; }
  #ui button.primary { background:#2f6df6; border-color:#2f6df6; }
  #ui button.primary:hover { background:#3d7bff; }
  #ui .btns { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  #ui .help { color:#8a94a6; font-size:12px; line-height:1.45; margin-top:8px; border-top:1px solid #2a3140; padding-top:8px; }
  #ui .val { width:38px; text-align:right; color:#8a94a6; font-variant-numeric: tabular-nums; }
  #stats { position:absolute; right:12px; top:12px; background:rgba(14,17,22,0.86); border:1px solid #2a3140; border-radius:10px; padding:10px 12px; font-size:12px; font-variant-numeric: tabular-nums; color:#b8c0cc; line-height:1.6; min-width:150px; }
  #stats b { color:#e6e9ef; }
</style>
</head>
<body>
<div id="ui">
  <h1>Воксели + мягкое тело · PoC</h1>
  <div class="row"><label>Сцена</label>
    <select id="scene">
      <option value="car">Машина в стену</option>
      <option value="jelly">Желе, башня, стекло</option>
    </select>
  </div>
  <div class="btns">
    <button id="launch" class="primary">Запустить машину</button>
    <button id="reset">Сброс</button>
    <button id="pause">Пауза</button>
  </div>
  <div class="row"><label>Жёсткость</label><input type="range" id="stiff" min="-1" max="0.4" step="0.05" value="0"><span class="val" id="stiffV">1.0</span></div>
  <div class="row"><label>Порог разрыва</label><input type="range" id="brk" min="0.3" max="3" step="0.05" value="1"><span class="val" id="brkV">1.0</span></div>
  <div class="row"><label>Пластичность</label><input type="range" id="plast" min="0" max="2" step="0.05" value="1"><span class="val" id="plastV">1.0</span></div>
  <div class="row"><label>Гравитация</label><input type="range" id="grav" min="0" max="40" step="1" value="12"><span class="val" id="gravV">25</span></div>
  <div class="row"><label>Скорость машины</label><input type="range" id="carv" min="15" max="90" step="5" value="45"><span class="val" id="carvV">45</span></div>
  <div class="row"><label>Сила ядра</label><input type="range" id="ballv" min="10" max="120" step="5" value="60"><span class="val" id="ballvV">60</span></div>
  <div class="row"><label>Показывать напряжение</label><input type="checkbox" id="stress"></div>
  <div class="help">
    <b>ЛКМ</b> — выстрел ядром в точку<br>
    <b>Shift + ЛКМ</b> — взрыв в точке<br>
    <b>Перетаскивание</b> — вращать камеру, <b>колесо</b> — зум<br>
    <b>Space</b> — пауза, <b>R</b> — сброс<br>
    Металл гнётся (пластично), кирпич и стекло крошатся, резина и желе тянутся.
  </div>
</div>
<div id="stats"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ============================================================
//  Физика: воксель = узел массы, соседи связаны "балками"
//  (XPBD-ограничения расстояния) с пластичностью и порогом разрыва.
//  Столкновения узел–узел через spatial hash, земля, тяжёлые ядра.
// ============================================================
const S = 1.0;                 // размер вокселя
const MAX_NODES = 16000;
const MAX_BEAMS = 220000;

// comp — податливость (1/жёсткость), yieldS — порог пластической текучести,
// plastic — скорость "запоминания" деформации, brk — порог разрыва (относит. деформация)
const MATS = {
  metal:  { color:[0.82,0.18,0.16], comp:2.5e-6, yieldS:0.02,  plastic:0.15, brk:0.55, dens:1.0 },
  steel:  { color:[0.60,0.64,0.70], comp:1.5e-6, yieldS:0.03,  plastic:0.10, brk:0.70, dens:1.6 },
  glass:  { color:[0.70,0.88,1.00], comp:1.5e-6, yieldS:9,     plastic:0,    brk:0.02, dens:0.6 },
  brick:  { color:[0.80,0.38,0.22], comp:1.5e-6, yieldS:9,     plastic:0,    brk:0.025,dens:1.3 },
  mortar: { color:[0.72,0.66,0.58], comp:2.5e-6, yieldS:9,     plastic:0,    brk:0.015,dens:1.2 },
  rubber: { color:[0.13,0.13,0.15], comp:1.0e-5, yieldS:9,     plastic:0,    brk:1.5,  dens:0.8 },
  jelly:  { color:[0.35,0.90,0.55], comp:2.5e-4, yieldS:9,     plastic:0,    brk:2.5,  dens:0.5 },
};
const MAT_LIST = Object.values(MATS);
Object.keys(MATS).forEach((k,i)=>{ MATS[k].id = i; });

// 13 уникальных смещений из 26 соседей (лексикографически положительные)
const OFFS = [];
for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++) {
  if (dx>0 || (dx===0 && dy>0) || (dx===0 && dy===0 && dz>0)) OFFS.push([dx,dy,dz]);
}
const HASH_SIZE = 1<<16, HASH_MASK = HASH_SIZE-1;

class World {
  constructor() {
    this.n = 0;
    this.pos  = new Float32Array(MAX_NODES*3);
    this.prev = new Float32Array(MAX_NODES*3);
    this.vel  = new Float32Array(MAX_NODES*3);
    this.invMass = new Float32Array(MAX_NODES);
    this.radius  = new Float32Array(MAX_NODES);
    this.mat   = new Uint8Array(MAX_NODES);
    this.obj   = new Int16Array(MAX_NODES);
    this.alive = new Uint8Array(MAX_NODES);
    this.big   = new Uint8Array(MAX_NODES);
    this.baseColor = new Float32Array(MAX_NODES*3);
    this.stress = new Float32Array(MAX_NODES);
    this.nbId   = new Int32Array(MAX_NODES*6).fill(-1);
    this.nbBeam = new Int32Array(MAX_NODES*6).fill(-1);
    this.rot = new Float32Array(MAX_NODES*9);
    for (let i=0;i<MAX_NODES;i++){ this.rot[i*9]=1; this.rot[i*9+4]=1; this.rot[i*9+8]=1; }

    this.nb = 0;
    this.bi = new Int32Array(MAX_BEAMS); this.bj = new Int32Array(MAX_BEAMS);
    this.rest  = new Float32Array(MAX_BEAMS); this.rest0 = new Float32Array(MAX_BEAMS);
    this.bComp = new Float32Array(MAX_BEAMS); this.bYield = new Float32Array(MAX_BEAMS);
    this.bPlast = new Float32Array(MAX_BEAMS); this.bBrk = new Float32Array(MAX_BEAMS);
    this.bAlive = new Uint8Array(MAX_BEAMS);
    this.active = new Int32Array(MAX_BEAMS); this.nActive = 0;
    this.broken = 0;

    this.cellStart = new Int32Array(HASH_SIZE+1);
    this.cellEntries = new Int32Array(MAX_NODES);

    this.objCount = 0; this.gridMaps = []; this.pending = [];
    this.balls = [];
  }
  newObject(){ this.gridMaps.push(new Map()); return this.objCount++; }
  addVoxel(obj, ix, iy, iz, origin, matName, jitter=0.06) {
    if (this.n >= MAX_NODES) return -1;
    const m = MATS[matName]; const i = this.n++;
    const p = i*3;
    this.pos[p]=origin[0]+ix*S; this.pos[p+1]=origin[1]+iy*S; this.pos[p+2]=origin[2]+iz*S;
    this.prev[p]=this.pos[p]; this.prev[p+1]=this.pos[p+1]; this.prev[p+2]=this.pos[p+2];
    this.vel[p]=this.vel[p+1]=this.vel[p+2]=0;
    this.invMass[i]=1/m.dens; this.radius[i]=0.45*S; this.mat[i]=m.id; this.obj[i]=obj;
    this.alive[i]=1; this.big[i]=0;
    const j=(Math.random()*2-1)*jitter;
    this.baseColor[p]=Math.min(1,Math.max(0,m.color[0]+j)); this.baseColor[p+1]=Math.min(1,Math.max(0,m.color[1]+j)); this.baseColor[p+2]=Math.min(1,Math.max(0,m.color[2]+j));
    this.gridMaps[obj].set(ix + iy*4096 + iz*4096*4096, i);
    this.pending.push([i,ix,iy,iz,obj]);
    return i;
  }
  addBeam(i, j, dirIdx) {
    if (this.nb >= MAX_BEAMS) return;
    const b = this.nb++;
    const mi = MAT_LIST[this.mat[i]], mj = MAT_LIST[this.mat[j]];
    const weak = mi.brk <= mj.brk ? mi : mj;
    const p=i*3,q=j*3;
    const dx=this.pos[q]-this.pos[p], dy=this.pos[q+1]-this.pos[p+1], dz=this.pos[q+2]-this.pos[p+2];
    const len = Math.sqrt(dx*dx+dy*dy+dz*dz);
    this.bi[b]=i; this.bj[b]=j; this.rest[b]=len; this.rest0[b]=len;
    this.bComp[b]=Math.max(mi.comp,mj.comp); this.bYield[b]=weak.yieldS; this.bPlast[b]=weak.plastic; this.bBrk[b]=weak.brk;
    this.bAlive[b]=1; this.active[this.nActive++]=b;
    if (dirIdx>=0) { // осевой сосед: запоминаем для ориентации и для пропуска коллизий
      this.nbId[i*6+dirIdx]=j; this.nbBeam[i*6+dirIdx]=b;
      this.nbId[j*6+(dirIdx^1)]=i; this.nbBeam[j*6+(dirIdx^1)]=b;
    }
  }
  finalize() {
    for (const [i,ix,iy,iz,obj] of this.pending) {
      const map = this.gridMaps[obj];
      for (const o of OFFS) {
        const j = map.get((ix+o[0]) + (iy+o[1])*4096 + (iz+o[2])*4096*4096);
        if (j===undefined) continue;
        let dir=-1;
        if (o[0]===1&&o[1]===0&&o[2]===0) dir=0; else if (o[0]===0&&o[1]===1&&o[2]===0) dir=2; else if (o[0]===0&&o[1]===0&&o[2]===1) dir=4;
        this.addBeam(i,j,dir);
      }
    }
    this.pending.length=0;
  }
  addBall(x,y,z,vx,vy,vz,r=1.3,mass=40){
    if (this.n>=MAX_NODES) return -1;
    const i=this.n++, p=i*3;
    this.pos[p]=x;this.pos[p+1]=y;this.pos[p+2]=z; this.prev[p]=x;this.prev[p+1]=y;this.prev[p+2]=z;
    this.vel[p]=vx;this.vel[p+1]=vy;this.vel[p+2]=vz;
    this.invMass[i]=1/mass; this.radius[i]=r; this.mat[i]=1; this.obj[i]=-1; this.alive[i]=1; this.big[i]=1;
    this.balls.push(i); return i;
  }
  killNode(i){
    if(!this.alive[i]) return;
    this.alive[i]=0;
    for(let d=0;d<6;d++){ const b=this.nbBeam[i*6+d]; if(b>=0 && this.bAlive[b]) this.bAlive[b]=0; }
    // диагональные балки этого узла отвалятся в solveBeams (проверка alive)
  }
  setObjVelocity(obj, vx,vy,vz){
    for(let i=0;i<this.n;i++) if(this.obj[i]===obj){ const p=i*3; this.vel[p]=vx; this.vel[p+1]=vy; this.vel[p+2]=vz; }
  }
  explode(cx,cy,cz,R,strength){
    const pos=this.pos, vel=this.vel;
    const R2=R*R, Rk=R*0.38;
    for(let i=0;i<this.n;i++){ if(!this.alive[i]) continue; const p=i*3;
      const dx=pos[p]-cx, dy=pos[p+1]-cy, dz=pos[p+2]-cz; const d2=dx*dx+dy*dy+dz*dz; if(d2>R2) continue;
      const d=Math.sqrt(d2)+1e-4;
      if(d<Rk && !this.big[i]){ this.killNode(i); continue; }
      const f=strength*(1-d/R)*this.invMass[i]*0.8;
      vel[p]+=dx/d*f; vel[p+1]+=dy/d*f+f*0.35; vel[p+2]+=dz/d*f;
    }
    const Rb=R*0.55, Rb2=Rb*Rb;
    for(let k=0;k<this.nActive;k++){ const b=this.active[k]; const i=this.bi[b],j=this.bj[b];
      const mx=(pos[i*3]+pos[j*3])*0.5-cx, my=(pos[i*3+1]+pos[j*3+1])*0.5-cy, mz=(pos[i*3+2]+pos[j*3+2])*0.5-cz;
      if(mx*mx+my*my+mz*mz<Rb2) this.bAlive[b]=0;
    }
  }

  step(frameDt, P){
    const sub=P.substeps, dt=frameDt/sub, dt2=dt*dt;
    const n=this.n, pos=this.pos, prev=this.prev, vel=this.vel, invMass=this.invMass, alive=this.alive;
    this.stress.fill(0,0,n);
    const g=P.gravity, damp=Math.max(0,1-P.damping*dt);
    for(let s=0;s<sub;s++){
      // предсказание
      for(let i=0;i<n;i++){ if(!alive[i]) continue; const p=i*3;
        if(invMass[i]>0) vel[p+1]-=g*dt;
        prev[p]=pos[p]; prev[p+1]=pos[p+1]; prev[p+2]=pos[p+2];
        pos[p]+=vel[p]*dt; pos[p+1]+=vel[p+1]*dt; pos[p+2]+=vel[p+2]*dt;
      }
      this.solveBeams(dt2, P);
      this.buildHash();
      this.solveCollisions();
      this.solveBalls();
      this.solveGround(P.friction);
      // скорости
      const inv=1/dt;
      for(let i=0;i<n;i++){ if(!alive[i]) continue; const p=i*3;
        vel[p]=(pos[p]-prev[p])*inv*damp; vel[p+1]=(pos[p+1]-prev[p+1])*inv*damp; vel[p+2]=(pos[p+2]-prev[p+2])*inv*damp;
      }
    }
  }
  solveBeams(dt2, P){
    const pos=this.pos, invMass=this.invMass, bi=this.bi, bj=this.bj, rest=this.rest, rest0=this.rest0;
    const bComp=this.bComp, bYield=this.bYield, bPlast=this.bPlast, bBrk=this.bBrk, bAlive=this.bAlive, active=this.active, stress=this.stress, alive=this.alive;
    const compScale=P.compScale/dt2, brkScale=P.brkScale, plastScale=P.plastScale;
    for(let k=0;k<this.nActive;k++){
      const b=active[k]; const i=bi[b], j=bj[b];
      if(!bAlive[b] || !alive[i] || !alive[j]){ bAlive[b]=0; active[k]=active[--this.nActive]; k--; this.broken++; continue; }
      const wi=invMass[i], wj=invMass[j], w=wi+wj; if(w===0) continue;
      const p=i*3,q=j*3;
      const dx=pos[q]-pos[p], dy=pos[q+1]-pos[p+1], dz=pos[q+2]-pos[p+2];
      const len=Math.sqrt(dx*dx+dy*dy+dz*dz); if(len<1e-6) continue;
      const r=rest[b], r0=rest0[b];
      const C=len-r, a=bComp[b]*compScale;
      const dl=-C/(w+a);
      const nx=dx/len, ny=dy/len, nz=dz/len;
      const ci=-wi*dl, cj=wj*dl;
      pos[p]+=ci*nx; pos[p+1]+=ci*ny; pos[p+2]+=ci*nz;
      pos[q]+=cj*nx; pos[q+1]+=cj*ny; pos[q+2]+=cj*nz;
      const totalStrain=Math.abs(len-r0)/r0, brk=bBrk[b]*brkScale;
      const sn=totalStrain/brk;
      if(sn>stress[i]) stress[i]=sn; if(sn>stress[j]) stress[j]=sn;
      if(totalStrain>brk){ bAlive[b]=0; active[k]=active[--this.nActive]; k--; this.broken++; continue; }
      const pl=bPlast[b]*plastScale;
      if(pl>0){ const es=Math.abs(len-r)/r0; if(es>bYield[b]) rest[b]=r+(len-r)*pl; }
    }
  }
  buildHash(){
    const n=this.n, pos=this.pos, alive=this.alive, big=this.big, cs=this.cellStart, ce=this.cellEntries;
    cs.fill(0);
    const inv=1/S;
    for(let i=0;i<n;i++){ if(!alive[i]||big[i]) continue; const p=i*3;
      const h=hashCell(Math.floor(pos[p]*inv),Math.floor(pos[p+1]*inv),Math.floor(pos[p+2]*inv)); cs[h]++; }
    let sum=0; for(let h=0;h<HASH_SIZE;h++){ const c=cs[h]; cs[h]=sum; sum+=c; } cs[HASH_SIZE]=sum;
    for(let i=0;i<n;i++){ if(!alive[i]||big[i]) continue; const p=i*3;
      const h=hashCell(Math.floor(pos[p]*inv),Math.floor(pos[p+1]*inv),Math.floor(pos[p+2]*inv)); ce[cs[h]++]=i; }
    for(let h=HASH_SIZE;h>0;h--) cs[h]=cs[h-1]; cs[0]=0;
  }
  solveCollisions(){
    const n=this.n, pos=this.pos, alive=this.alive, big=this.big, cs=this.cellStart, ce=this.cellEntries, invMass=this.invMass, radius=this.radius, nbId=this.nbId, nbBeam=this.nbBeam, bAlive=this.bAlive;
    const inv=1/S;
    for(let i=0;i<n;i++){ if(!alive[i]||big[i]) continue; const p=i*3;
      const cx=Math.floor(pos[p]*inv), cy=Math.floor(pos[p+1]*inv), cz=Math.floor(pos[p+2]*inv);
      const ri=radius[i], wi=invMass[i];
      for(let ox=-1;ox<=1;ox++) for(let oy=-1;oy<=1;oy++) for(let oz=-1;oz<=1;oz++){
        const h=hashCell(cx+ox,cy+oy,cz+oz);
        for(let e=cs[h], end=cs[h+1]; e<end; e++){
          const j=ce[e]; if(j<=i) continue;
          const q=j*3;
          const dx=pos[q]-pos[p], dy=pos[q+1]-pos[p+1], dz=pos[q+2]-pos[p+2];
          const dmin=ri+radius[j]; const d2=dx*dx+dy*dy+dz*dz;
          if(d2>=dmin*dmin || d2<1e-10) continue;
          // соединённые осевой балкой соседи не сталкиваются
          let linked=false;
          for(let d=0;d<6;d++){ if(nbId[i*6+d]===j && bAlive[nbBeam[i*6+d]]){ linked=true; break; } }
          if(linked) continue;
          const wj=invMass[j], w=wi+wj; if(w===0) continue;
          const dist=Math.sqrt(d2); const corr=(dmin-dist)/dist/w;
          const ci=-wi*corr, cj=wj*corr;
          pos[p]+=dx*ci; pos[p+1]+=dy*ci; pos[p+2]+=dz*ci;
          pos[q]+=dx*cj; pos[q+1]+=dy*cj; pos[q+2]+=dz*cj;
        }
      }
    }
  }
  solveBalls(){
    const n=this.n, pos=this.pos, alive=this.alive, big=this.big, invMass=this.invMass, radius=this.radius;
    for(const bIdx of this.balls){ if(!alive[bIdx]) continue; const p=bIdx*3; const rb=radius[bIdx], wb=invMass[bIdx];
      const bx=pos[p],by=pos[p+1],bz=pos[p+2];
      const reach=rb+0.5*S; const r2=reach*reach;
      for(let j=0;j<n;j++){ if(!alive[j]||big[j]) continue; const q=j*3;
        const dx=pos[q]-bx, dy=pos[q+1]-by, dz=pos[q+2]-bz; const d2=dx*dx+dy*dy+dz*dz;
        const dmin=rb+radius[j]; if(d2>=dmin*dmin||d2<1e-10) continue;
        const wj=invMass[j], w=wb+wj; const dist=Math.sqrt(d2); const corr=(dmin-dist)/dist/w;
        const cb=-wb*corr, cj=wj*corr;
        pos[p]+=dx*cb; pos[p+1]+=dy*cb; pos[p+2]+=dz*cb;
        pos[q]+=dx*cj; pos[q+1]+=dy*cj; pos[q+2]+=dz*cj;
      }
    }
  }
  solveGround(mu){
    const n=this.n, pos=this.pos, prev=this.prev, alive=this.alive, radius=this.radius;
    for(let i=0;i<n;i++){ if(!alive[i]) continue; const p=i*3; const r=radius[i];
      if(pos[p+1]<r){ pos[p+1]=r; prev[p]=pos[p]-(pos[p]-prev[p])*(1-mu); prev[p+2]=pos[p+2]-(pos[p+2]-prev[p+2])*(1-mu); }
    }
  }
}
function hashCell(x,y,z){ return ((x*73856093) ^ (y*19349663) ^ (z*83492791)) & HASH_MASK; }

// ============================================================
//  Сцены
// ============================================================
function buildCarScene(w){
  // Машина
  const car=w.newObject();
  const L=22, W=10, H=4, o=[0, 3.45, 0];
  for(let x=0;x<L;x++) for(let y=0;y<H;y++) for(let z=0;z<W;z++){
    let m='metal';
    if(x===0||x===L-1) m='steel';                    // бамперы
    if(y===0 && (x<3||x>L-4)) m='steel';
    if((x===4||x===5||x===L-6||x===L-5) && y<2 && (z<2||z>W-3)) continue; // колёсные арки
    w.addVoxel(car,x,y,z,o,m);
  }
  // Кабина
  for(let x=6;x<16;x++) for(let y=H;y<H+4;y++) for(let z=1;z<W-1;z++){
    const edge = (x===6||x===15||z===1||z===W-2);
    const top = (y===H+3);
    if(!edge && !top) continue; // полая кабина
    let m='metal';
    if(edge && !top && y>=H+1 && y<=H+2) m='glass';
    if(edge && !top && (x===6||x===15) && (z===1||z===W-2)) m='steel'; // стойки
    w.addVoxel(car,x,y,z,o,m);
  }
  // Колёса (резина, стальная ступица)
  for(const cx of [4.5, L-5.5]) for(const cz of [-2, W]) {
    for(let x=-3;x<=3;x++) for(let y=-3;y<=3;y++) for(let z=0;z<2;z++){
      const r=Math.sqrt(x*x+y*y); if(r>3.2) continue;
      const m = r<1.2 ? 'steel' : 'rubber';
      w.addVoxel(car, Math.round(cx)+x, y, cz+z, [0, 3.45, 0], m);
    }
  }
  w.finalize();
  // Стена из кирпича со швами
  const wall=w.newObject();
  const WX=2, WY=18, WZ=30, ow=[36,0.45,(W-WZ)/2];
  for(let x=0;x<WX;x++) for(let y=0;y<WY;y++) for(let z=0;z<WZ;z++){
    const row=Math.floor(y/2); const shift=(row%2)*2;
    const mortar = (y%2===1) || ((z+shift)%4===3);
    w.addVoxel(wall,x,y,z,ow, mortar?'mortar':'brick', 0.05);
  }
  w.finalize();
  return { carObj: car, center:[20,6,W/2] };
}
function buildJellyScene(w){
  const jelly=w.newObject();
  const J=12;
  for(let x=0;x<J;x++) for(let y=0;y<J;y++) for(let z=0;z<J;z++) w.addVoxel(jelly,x,y,z,[-6,14,-6],'jelly',0.04);
  w.finalize();
  const tower=w.newObject();
  for(let x=0;x<7;x++) for(let y=0;y<26;y++) for(let z=0;z<7;z++){
    const hollow = x>0&&x<6&&z>0&&z<6; if(hollow && y>0) continue;
    const mortar=(y%3===2)||((x+z+Math.floor(y/3))%3===0);
    w.addVoxel(tower,x,y,z,[16,0.45,-3.5], mortar?'mortar':'brick',0.05);
  }
  w.finalize();
  const glass=w.newObject();
  for(let x=0;x<2;x++) for(let y=0;y<14;y++) for(let z=0;z<18;z++){
    const frame = y===0 || y===13 || z===0 || z===17;
    w.addVoxel(glass,x,y,z,[-18,0.45,-9], frame?'steel':'glass', frame?0.06:0.03);
  }
  w.finalize();
  const beam=w.newObject();
  for(let x=0;x<30;x++) for(let y=0;y<2;y++) for(let z=0;z<3;z++) w.addVoxel(beam,x,y,z,[-12,26.45,10],'metal');
  for(let x of [0,1,28,29]) for(let y=0;y<26;y++) for(let z=0;z<3;z++) w.addVoxel(beam,x,-1-y,z,[-12,26.45,10],'steel');
  w.finalize();
  return { carObj:-1, center:[0,8,0] };
}

// ============================================================
//  Рендер
// ============================================================
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0e1116); scene.fog=new THREE.Fog(0x0e1116,120,260);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,600);
scene.add(new THREE.HemisphereLight(0xbfd4ff,0x2a2016,0.75));
const sun=new THREE.DirectionalLight(0xffffff,1.0); sun.position.set(40,70,30); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); const sc=sun.shadow.camera; sc.left=-70; sc.right=70; sc.top=70; sc.bottom=-70; sc.near=1; sc.far=250; sun.shadow.bias=-0.0005;
scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600), new THREE.MeshStandardMaterial({color:0x1c222c, roughness:0.95}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const grid=new THREE.GridHelper(300,60,0x2c3546,0x222a38); grid.position.y=0.01; scene.add(grid);

const boxGeo=new THREE.BoxGeometry(0.94*S,0.94*S,0.94*S);
const inst=new THREE.InstancedMesh(boxGeo,new THREE.MeshStandardMaterial({roughness:0.6,metalness:0.1}),MAX_NODES);
inst.castShadow=true; inst.receiveShadow=true; inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
inst.setColorAt(0,new THREE.Color(1,1,1)); inst.instanceColor.setUsage(THREE.DynamicDrawUsage);
scene.add(inst);
const ballGeo=new THREE.SphereGeometry(1,24,16), ballMat=new THREE.MeshStandardMaterial({color:0x333a44,roughness:0.35,metalness:0.7});
const ballMeshes=[];

// камера-орбита
const cam={theta:0.9, phi:1.1, dist:70, target:new THREE.Vector3(24,6,5)};
function updateCamera(){
  const t=cam.target; const sp=Math.sin(cam.phi);
  camera.position.set(t.x+cam.dist*sp*Math.cos(cam.theta), t.y+cam.dist*Math.cos(cam.phi), t.z+cam.dist*sp*Math.sin(cam.theta));
  camera.lookAt(t);
}

// ============================================================
//  Состояние / UI
// ============================================================
const P={ substeps:12, gravity:12, damping:0.6, friction:0.15, compScale:1, brkScale:1, plastScale:1, showStress:false, ballSpeed:60, carSpeed:45 };
let world, sceneInfo, paused=false;
const ui=id=>document.getElementById(id);
function resetScene(){
  world=new World(); world.broken=0;
  for(const m of ballMeshes) scene.remove(m); ballMeshes.length=0;
  sceneInfo = ui('scene').value==='car' ? buildCarScene(world) : buildJellyScene(world);
  cam.target.set(...sceneInfo.center);
  ui('launch').style.display = sceneInfo.carObj>=0 ? '' : 'none';
  updateCamera();
}
ui('scene').addEventListener('change',resetScene);
ui('reset').addEventListener('click',resetScene);
ui('launch').addEventListener('click',()=>{ if(sceneInfo.carObj>=0) world.setObjVelocity(sceneInfo.carObj,P.carSpeed,0,0); });
ui('pause').addEventListener('click',()=>{ paused=!paused; ui('pause').textContent=paused?'Продолжить':'Пауза'; });
function bindSlider(id, fn, fmt){ const el=ui(id); const upd=()=>{ fn(+el.value); ui(id+'V').textContent=fmt(+el.value); }; el.addEventListener('input',upd); upd(); }
bindSlider('stiff', v=>{ P.compScale=Math.pow(10,-v); }, v=>Math.pow(10,v).toFixed(1));
bindSlider('brk', v=>{ P.brkScale=v; }, v=>v.toFixed(2));
bindSlider('plast', v=>{ P.plastScale=v; }, v=>v.toFixed(2));
bindSlider('grav', v=>{ P.gravity=v; }, v=>v.toFixed(0));
bindSlider('ballv', v=>{ P.ballSpeed=v; }, v=>v.toFixed(0));
bindSlider('carv', v=>{ P.carSpeed=v; }, v=>v.toFixed(0));
ui('stress').addEventListener('change',e=>{ P.showStress=e.target.checked; });
window.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); ui('pause').click(); } if(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К') resetScene(); });

// мышь: drag = орбита, click = ядро, shift+click = взрыв
const canvas=renderer.domElement; let dragging=false, moved=0, lx=0, ly=0;
canvas.addEventListener('mousedown',e=>{ dragging=true; moved=0; lx=e.clientX; ly=e.clientY; });
window.addEventListener('mousemove',e=>{ if(!dragging) return; const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
  cam.theta+=dx*0.006; cam.phi=Math.min(Math.PI/2-0.05,Math.max(0.15,cam.phi-dy*0.006)); updateCamera(); });
window.addEventListener('mouseup',e=>{ if(!dragging) return; dragging=false; if(moved<5) onClick(e); });
canvas.addEventListener('wheel',e=>{ e.preventDefault(); cam.dist=Math.min(220,Math.max(12,cam.dist*Math.exp(e.deltaY*0.0015))); updateCamera(); },{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
const raycaster=new THREE.Raycaster();
function onClick(e){
  const m=new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(m,camera);
  inst.count=world.n;
  const hits=raycaster.intersectObjects([inst,ground],false);
  if(!hits.length) return;
  const pt=hits[0].point;
  if(e.shiftKey){ world.explode(pt.x,pt.y,pt.z,7,60); }
  else {
    const dir=pt.clone().sub(camera.position).normalize();
    const start=camera.position.clone().add(dir.clone().multiplyScalar(3));
    const i=world.addBall(start.x,start.y,start.z,dir.x*P.ballSpeed,dir.y*P.ballSpeed,dir.z*P.ballSpeed);
    if(i>=0){ const mesh=new THREE.Mesh(ballGeo,ballMat); mesh.scale.setScalar(world.radius[i]); mesh.castShadow=true; mesh.userData.node=i; scene.add(mesh); ballMeshes.push(mesh); }
  }
}
window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

// обновление инстансов: позиция + ориентация из живых осевых соседей
const M=new THREE.Matrix4(), col=new THREE.Color();
const tmp=new Float32Array(9);
function updateInstances(){
  const w=world, n=w.n, pos=w.pos, alive=w.alive, big=w.big, rot=w.rot, nbId=w.nbId, nbBeam=w.nbBeam, bAlive=w.bAlive, stress=w.stress, base=w.baseColor;
  const el=M.elements; const ic=inst.instanceColor.array;
  for(let i=0;i<n;i++){
    if(!alive[i]||big[i]){ el.fill(0); inst.setMatrixAt(i,M); continue; }
    const p=i*3, r=i*9;
    let hx=0,hy=0,hz=0; tmp.fill(0);
    for(let d=0;d<6;d++){ const j=nbId[i*6+d]; if(j<0) continue; const b=nbBeam[i*6+d]; if(!bAlive[b]||!alive[j]) continue;
      const sgn=(d&1)?-1:1; const ax=(d>>1)*3; const q=j*3;
      tmp[ax]+=(pos[q]-pos[p])*sgn; tmp[ax+1]+=(pos[q+1]-pos[p+1])*sgn; tmp[ax+2]+=(pos[q+2]-pos[p+2])*sgn;
      if(ax===0) hx=1; else if(ax===3) hy=1; else hz=1;
    }
    if(hx+hy+hz>0){
      let ex=[tmp[0],tmp[1],tmp[2]], ey=[tmp[3],tmp[4],tmp[5]], ez=[tmp[6],tmp[7],tmp[8]];
      if(hx+hy+hz===1){ // одна ось: берём вторую из прошлой ориентации
        if(hx) ey=[rot[r+3],rot[r+4],rot[r+5]]; else if(hy) ez=[rot[r+6],rot[r+7],rot[r+8]]; else ex=[rot[r],rot[r+1],rot[r+2]];
        if(hx){ ez=cross(ex,ey); ey=cross(ez,ex); } else if(hy){ ex=cross(ey,ez); ez=cross(ex,ey); } else { ey=cross(ez,ex); ex=cross(ey,ez); }
      } else if(!hz){ ez=cross(ex,ey); } else if(!hy){ ey=cross(ez,ex); } else if(!hx){ ex=cross(ey,ez); }
      norm(ex); const dp=ey[0]*ex[0]+ey[1]*ex[1]+ey[2]*ex[2]; ey=[ey[0]-dp*ex[0],ey[1]-dp*ex[1],ey[2]-dp*ex[2]]; norm(ey); ez=cross(ex,ey);
      if(isFinite(ex[0]+ey[0]+ez[0])){ rot[r]=ex[0];rot[r+1]=ex[1];rot[r+2]=ex[2]; rot[r+3]=ey[0];rot[r+4]=ey[1];rot[r+5]=ey[2]; rot[r+6]=ez[0];rot[r+7]=ez[1];rot[r+8]=ez[2]; }
    }
    el[0]=rot[r];el[1]=rot[r+1];el[2]=rot[r+2];el[3]=0; el[4]=rot[r+3];el[5]=rot[r+4];el[6]=rot[r+5];el[7]=0; el[8]=rot[r+6];el[9]=rot[r+7];el[10]=rot[r+8];el[11]=0; el[12]=pos[p];el[13]=pos[p+1];el[14]=pos[p+2];el[15]=1;
    inst.setMatrixAt(i,M);
    if(P.showStress){ const s=Math.min(1,stress[i]); const t=s*s; ic[p]=0.15+0.85*Math.min(1,t*2); ic[p+1]=0.15+0.85*(t<0.5? t*2 : 1-(t-0.5)*2)*0.9; ic[p+2]=0.25*(1-t); }
    else { ic[p]=base[p]; ic[p+1]=base[p+1]; ic[p+2]=base[p+2]; }
  }
  inst.count=n; inst.instanceMatrix.needsUpdate=true; inst.instanceColor.needsUpdate=true;
  for(const mesh of ballMeshes){ const q=mesh.userData.node*3; mesh.position.set(pos[q],pos[q+1],pos[q+2]); }
}
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function norm(v){ const l=Math.hypot(v[0],v[1],v[2])||1; v[0]/=l; v[1]/=l; v[2]/=l; }

// главный цикл
let fpsT=performance.now(), frames=0, fps=0, physMs=0, drawMs=0, lastT=performance.now(), acc=0;
const FIXED_DT=1/60;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now(); let dt=(now-lastT)/1000; lastT=now; if(dt>0.1) dt=0.1;
  if(!paused){
    acc+=dt; let steps=0; const t0=performance.now();
    while(acc>=FIXED_DT && steps<2){ world.step(FIXED_DT,P); acc-=FIXED_DT; steps++; }
    if(acc>FIXED_DT) acc=0; // не успеваем — замедляем время, а не копим долг
    if(steps) physMs=physMs*0.9+(performance.now()-t0)/steps*0.1;
  }
  const t1=performance.now(); updateInstances(); renderer.render(scene,camera); drawMs=drawMs*0.9+(performance.now()-t1)*0.1;
  frames++; if(now-fpsT>500){ fps=frames*1000/(now-fpsT); frames=0; fpsT=now;
    ui('stats').innerHTML=`<b>${fps.toFixed(0)}</b> fps · физика <b>${physMs.toFixed(1)}</b> мс · рендер <b>${drawMs.toFixed(1)}</b> мс<br>вокселей: <b>${world.n-world.balls.length}</b><br>балок: <b>${world.nActive}</b> / ${world.nb}<br>сломано: <b>${world.broken}</b><br>подшагов: ${P.substeps}`; }
}
resetScene(); loop();
</script>
